# Personal / single-user deployment (e.g. Aliyun ECS).
# - Binds a non-default host port (52889) to the app (8899 inside the container).
# - No loopback trust: set API_AUTH_KEY in agent/.env before exposing the port.
# - Frontend is baked into the image; one URL serves UI + API.
#
#   docker compose -f docker-compose.prod.yml up --build -d
#   open http://<server-ip>:52889

services:
  vibe-trading:
    build:
      context: .
      args:
        SLIM: "2"
    ports:
      - "52889:8899"
    env_file:
      - agent/.env
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
    extra_hosts:
      # Linux ECS: reach host mongod from the container (requires bindIp patch once)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent:/app/agent
      - ./tools:/app/tools:ro
      - vibe-runs:/app/agent/runs
      - vibe-sessions:/app/agent/sessions
      # Screener results / panel cache / scan status live under the service user's
      # home. Persist them so rebuilds don't wipe results and the web keeps data.
      - vibe-data:/home/vibe/.vibe-trading
    restart: unless-stopped

volumes:
  vibe-runs:
  vibe-sessions:
  vibe-data:
