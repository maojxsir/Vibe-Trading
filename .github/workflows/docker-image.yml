name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      slim:
        description: "SLIM level (0=full, 1=OCR no PDF, 2=ecs minimal)"
        required: true
        default: "1"
        type: choice
        options:
          - "0"
          - "1"
          - "2"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SLIM=${{ inputs.slim }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/vibe-trading:slim-${{ inputs.slim }}
            ghcr.io/${{ github.repository_owner }}/vibe-trading:latest
